<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4d071b">
<title>शिवाराम पटेल लूणी — प्रीमियम पोस्टर मेकर</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700;800;900&display=swap');
:root{--wine:#56091f;--wine2:#861b3b;--gold:#f0ce70;--cream:#fff5e5;--ink:#2d1119;--green:#18754f}
*{box-sizing:border-box}
body{margin:0;background:#f4eee8;color:var(--ink);font-family:"Noto Sans Devanagari",system-ui,sans-serif}
header{position:relative;overflow:hidden;text-align:center;padding:22px 14px 18px;color:#ffe9a7;background:radial-gradient(ellipse at 50% 0,#8d2840 0,#52091f 55%,#27040d 100%);border-bottom:4px solid #d9ad48}
header:before,header:after{content:"✦ ❧ ✦";position:absolute;top:10px;color:#e9c96c;font-size:23px;opacity:.75}
header:before{left:12px}header:after{right:12px}
header h1{font-size:clamp(22px,4vw,36px);line-height:1.3;margin:0;font-weight:900;text-shadow:0 2px 0 #30030d}
header .sub{font-size:14px;margin:8px 0 0;color:#fff4d8}
main{max-width:1160px;margin:0 auto;padding:14px;display:grid;grid-template-columns:minmax(270px,350px) minmax(0,1fr);gap:14px;align-items:start}
.panel,.preview,.gallery{background:#fff;border-radius:18px;padding:15px;box-shadow:0 7px 25px #46101a10;border:1px solid #f0e4d9}
h2{font-size:19px;margin:0 0 12px}
label{display:block;font-size:14px;font-weight:800;margin:12px 0 6px}
input[type=text],input[type=file]{display:block;width:100%;font:inherit;font-size:15px;border:1px solid #d9c9c9;border-radius:11px;padding:11px;background:#fff}
input[type=file]{padding:10px}
.templates{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.templ{border:1px solid #ddc9ba;border-radius:11px;background:#fffaf2;padding:10px 7px;color:#5d1429;font:700 13px inherit;min-height:46px}
.templ.active{border:2px solid #8c1737;background:#fff0f1;box-shadow:0 3px 12px #7b17301a}
.btn{width:100%;border:0;border-radius:11px;padding:13px 10px;margin-top:9px;font:800 15px inherit;cursor:pointer}
.download{background:linear-gradient(100deg,#56091f,#901c3e);color:white}
.share{background:linear-gradient(100deg,#14764e,#20865b);color:white}
.soft{background:#f4e7d0;color:#4c0b20;border:1px solid #e8d1a8}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hint{font-size:12px;line-height:1.55;color:#887a7a;margin:9px 0 0}
.preview-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pill{font-size:11px;background:#f5eadb;border-radius:999px;padding:5px 8px;color:#702039;white-space:nowrap}
.canvas-wrap{max-width:500px;margin:0 auto;background:#eadfdb;border-radius:12px;overflow:hidden;box-shadow:0 5px 20px #32101920}
canvas{display:block;width:100%;height:auto}
.footer-note{text-align:center;color:#827477;font-size:12px;margin:10px 0 0}
.gallery{grid-column:1/-1}
.gallery h2{margin-bottom:10px}
.gallery-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.thumb{padding:5px;border:1px solid #e3d3c4;background:#fffaf4;border-radius:9px;cursor:pointer;text-align:center;color:#4b1725;font:700 11px inherit}
.thumb canvas{border-radius:5px;margin-bottom:5px}
.thumb.active{border:2px solid #9c1c3e;background:#fff0f0}
@media(max-width:780px){main{grid-template-columns:1fr;padding:9px}.panel,.preview,.gallery{padding:12px}.gallery-grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}.thumb{font-size:10px;padding:3px}.canvas-wrap{max-width:480px}header{padding-top:22px}}
@media(min-width:781px){.panel{position:sticky;top:12px}}
</style>
</head>
<body>
<header>
<h1>शिवाराम पटेल लूणी — प्रीमियम पोस्टर मेकर</h1>
<p class="sub">5 प्रीमियम थीम · निवेदक का नाम और फोटो बदलें · PNG डाउनलोड</p>
</header>
<main>
<section class="panel">
<h2>पोस्टर कस्टमाइज़ करें</h2>
<label>डिज़ाइन थीम चुनें</label>
<div class="templates">
<button class="templ active" data-t="0">रॉयल क्लासिक</button>
<button class="templ" data-t="1">आधुनिक प्रोफेशनल</button>
<button class="templ" data-t="2">राजस्थानी परंपरा</button>
<button class="templ" data-t="3">विकास थीम</button>
<button class="templ" data-t="4">युवा और भविष्य</button>
</div>
<label for="nm">निवेदक का नाम</label>
<input id="nm" type="text" maxlength="55" placeholder="आपका नाम यहाँ लिखें">
<label for="photo">निवेदक की फोटो</label>
<input id="photo" type="file" accept="image/*">
<button class="btn download" id="dl">↓ PNG पोस्टर डाउनलोड करें</button>
<button class="btn share" id="share">↗ पोस्टर शेयर करें (WhatsApp / Instagram / Facebook)</button>
<div class="twocol">
<button class="btn soft" id="wa">WhatsApp पर लिंक भेजें</button>
<button class="btn soft" id="copy">पोर्टल लिंक कॉपी करें</button>
</div>
<button class="btn soft" id="reset">रीसेट करें</button>
</section>
<section class="preview">
<div class="preview-head"><h2>पोस्टर प्रीव्यू</h2><span class="pill">1080 × 1920 · स्टेटस साइज</span></div>
<div class="canvas-wrap"><canvas id="poster" width="1080" height="1920"></canvas></div>

</section>
<section class="gallery">
<h2>सभी टेम्पलेट प्रीव्यू</h2>
<div class="gallery-grid" id="gallery"></div>
</section>
</main>
<script>
(()=>{
const PORTAL=location.href.split('#')[0];
const C={village:"ग्राम पंचायत लूणी",role:"सरपंच पद हेतु",name:"शिवाराम पटेल",nick:"(आपणो शिव)"};
const themes=[
{bg:"#59091d",deep:"#26040d",gold:"#f2cf69",cream:"#fff2d8",accent:"#a51e3b",tag:"आपका विश्वास • हमारी जिम्मेदारी",kind:0},
{bg:"#f7ead2",deep:"#173650",gold:"#d9ac45",cream:"#fffaf0",accent:"#9a2d25",tag:"बेहतर कल के लिए • सही नेतृत्व",kind:1},
{bg:"#68111f",deep:"#31050d",gold:"#f0c45c",cream:"#fff0d6",accent:"#c84a2d",tag:"हमारा संकल्प • मजबूत पंचायत",kind:2},
{bg:"#e9f4fa",deep:"#173f5a",gold:"#d7a83b",cream:"#fffdf4",accent:"#17694f",tag:"विकास • पारदर्शिता • जनसेवा",kind:3},
{bg:"#f9e8c7",deep:"#53101c",gold:"#f0bd4c",cream:"#fff8e9",accent:"#183f57",tag:"नई सोच • नई ऊर्जा • नई उम्मीद",kind:4}
];
const cv=document.getElementById('poster'),x=cv.getContext('2d'),nm=document.getElementById('nm'),file=document.getElementById('photo'),gallery=document.getElementById('gallery');
let t=0,applicant=null,candidate=null,thumbs=[];
function txt(s,a,b,size,color,weight=800,align='center',max=1000){x.fillStyle=color;x.font=`${weight} ${size}px "Noto Sans Devanagari",system-ui,sans-serif`;x.textAlign=align;x.textBaseline='middle';x.fillText(s,a,b,max)}
function fit(s,a,b,max,min,width,color,weight=900){let z=max;do{x.font=`${weight} ${z}px "Noto Sans Devanagari",system-ui,sans-serif`;if(x.measureText(s).width<=width)break;z-=2}while(z>min);txt(s,a,b,z,color,weight,'center',width)}
function rr(a,b,w,h,r,fill,stroke,lw=4){x.beginPath();x.roundRect(a,b,w,h,r);if(fill){x.fillStyle=fill;x.fill()}if(stroke){x.strokeStyle=stroke;x.lineWidth=lw;x.stroke()}}
function cover(im,a,b,w,h){if(!im)return;const sc=Math.max(w/im.width,h/im.height),dw=im.width*sc,dh=im.height*sc;x.save();x.beginPath();x.rect(a,b,w,h);x.clip();x.drawImage(im,a+(w-dw)/2,b+(h-dh)/2,dw,dh);x.restore()}
function ornate(p){x.strokeStyle=p.gold;x.lineWidth=4;x.strokeRect(24,24,1032,1872);x.lineWidth=2;x.strokeRect(42,42,996,1836);for(const [a,b,sx,sy] of [[55,55,1,1],[1025,55,-1,1],[55,1865,1,-1],[1025,1865,-1,-1]]){x.save();x.translate(a,b);x.scale(sx,sy);x.strokeStyle=p.gold;x.lineWidth=3;x.beginPath();x.moveTo(0,55);x.quadraticCurveTo(0,0,55,0);x.lineTo(90,0);x.moveTo(0,27);x.quadraticCurveTo(27,27,27,0);x.stroke();x.restore()}}
function photo(im,a,b,w,h,p,label){x.save();x.beginPath();x.roundRect(a,b,w,h,22);x.clip();x.fillStyle=(p.cream||"#fff8e9");x.fillRect(a,b,w,h);if(im){const sc=Math.min(w/im.width,h/im.height),dw=im.width*sc,dh=im.height*sc;x.drawImage(im,a+(w-dw)/2,b+(h-dh)/2,dw,dh)}else{const g=x.createLinearGradient(a,b,a+w,b+h);g.addColorStop(0,'#c9e7ff');g.addColorStop(1,'#7db9ed');x.fillStyle=g;x.fillRect(a,b,w,h);txt(label,a+w/2,b+h/2,25,'#244c70',700)}x.restore();rr(a,b,w,h,22,null,p.gold,5)}
function pill(p,y,s){rr(120,y,840,76,24,p.deep,p.gold,3);txt(s,540,y+38,30,p.cream,800,'center',790)}
function applicantBlock(p){
 rr(65,1470,950,315,28,p.deep,p.gold,5);
 photo(applicant,92,1518,155,185,p,"आपकी फोटो");
 txt("निवेदक",280,1545,27,p.gold,800,'left');
 fit((nm.value||"आपका नाम यहाँ लिखें").trim(),620,1620,43,25,670,p.cream,900);
 x.fillStyle=p.gold;x.fillRect(280,1660,660,3);
 txt("जनसेवा • विश्वास • प्रगति",610,1705,25,p.cream,700,'center',620);
 txt("Developed by Surendra Patel",540,1827,22,"#d8c7a5",600,'center',900);
 txt(PORTAL,540,1860,12,"#d8c7a5",500,'center',940);
}
function draw(){
 const p=themes[t];x.clearRect(0,0,1080,1920);
 const bg=x.createLinearGradient(0,0,1080,1920);bg.addColorStop(0,p.bg);bg.addColorStop(1,p.deep);x.fillStyle=bg;x.fillRect(0,0,1080,1920);ornate(p);
 if(t===0){
  const g=x.createLinearGradient(0,80,0,1400);g.addColorStop(0,"#86132c");g.addColorStop(1,p.deep);rr(58,58,964,1370,35,g,p.gold,7);
  txt(C.village,540,120,48,p.gold);txt(C.role,540,180,42,p.cream);pill(p,225,p.tag);
  photo(candidate,92,320,455,700,p,"उम्मीदवार की फोटो");
  txt("शिवाराम",780,390,59,p.gold);txt("पटेल",780,455,59,p.gold);txt("(आपणो शिव)",780,520,30,p.cream);
  x.fillStyle=p.gold;x.fillRect(640,570,280,4);txt("ईमानदार नेतृत्व",780,635,30,p.cream);txt("विकास की नई सोच",780,690,30,p.cream);
  rr(590,760,360,300,25,"#f8dfaa",p.gold,4);txt("आपका विश्वास",770,825,31,p.deep);txt("हमारी जिम्मेदारी",770,885,33,p.accent);txt("जनता के साथ",770,955,27,p.deep);
  txt("विकास का संकल्प",540,1190,30,p.gold);txt("जनता की आवाज़ • पारदर्शिता",540,1240,27,p.cream);
 }else if(t===1){
  rr(55,55,970,1375,26,p.cream,p.gold,6);txt(C.village,540,120,49,p.deep);txt(C.role,540,180,42,p.accent);
  txt("शिवाराम पटेल",540,275,62,p.deep);txt("(आपणो शिव)",540,330,30,p.accent);
  photo(candidate,185,365,710,800,p,p.gold);pill(p,1190,p.tag);
  txt("जनता की आवाज़",540,1310,33,p.deep);txt("विकास का संकल्प",540,1360,33,p.accent);
 }else if(t===2){
  txt("म्हारी लूणी • म्हारो मान",540,115,36,p.gold);txt(C.village,540,180,47,p.cream);txt(C.role,540,240,40,p.gold);
  photo(candidate,95,300,890,760,p,p.gold);txt("शिवाराम पटेल",540,1120,62,p.gold);txt("(आपणो शिव)",540,1180,31,p.cream);
  rr(110,1230,860,175,20,"#f6d69c",p.gold,4);txt("हमारा संकल्प • मजबूत पंचायत",540,1290,34,p.deep);txt("अपणायत • विश्वास • विकास",540,1350,28,p.accent);
 }else if(t===3){
  rr(55,55,970,1375,24,"#f8fcff",p.gold,6);x.fillStyle=p.deep;x.fillRect(60,60,960,235);
  txt(C.village,540,120,47,p.cream);txt(C.role,540,180,42,p.gold);txt("शिवाराम पटेल",540,250,42,p.cream);
  photo(candidate,80,330,520,710,p,p.gold);txt("(आपणो शिव)",805,390,30,p.deep);txt("विकास",805,490,45,p.accent);txt("पारदर्शिता",805,565,35,p.deep);txt("जनसेवा",805,640,42,p.accent);
  rr(650,710,310,245,22,"#e5f3e9","#74b294",3);txt("हर वार्ड",805,770,30,p.deep);txt("हर परिवार",805,825,30,p.deep);txt("की आवाज़",805,880,30,p.deep);
  pill(p,1090,p.tag);txt("लूणी के उज्ज्वल भविष्य के लिए",540,1360,29,p.deep);
 }else{
  rr(55,55,970,1375,24,"#f9e9c8",p.gold,6);txt(C.village,540,120,47,p.deep);txt(C.role,540,180,42,p.accent);
  photo(candidate,85,265,475,760,p,p.gold);txt("शिवाराम",790,385,53,p.deep);txt("पटेल",790,450,58,p.accent);txt("(आपणो शिव)",790,510,29,p.deep);
  rr(610,585,350,370,25,p.deep,p.gold,4);txt("युवा सोच",785,660,37,p.gold);txt("सशक्त पंचायत",785,735,30,p.cream);txt("उज्ज्वल भविष्य",785,805,30,p.cream);txt("सबका साथ",785,875,29,p.gold);
  pill(p,1090,p.tag);txt("जनता के साथ • जनता के लिए",540,1360,29,p.deep);
 }
 applicantBlock(p);
}
function updateThumbs(){
 gallery.innerHTML='';thumbs=[];
 themes.forEach((p,i)=>{const b=document.createElement('button');b.className='thumb'+(i===t?' active':'');b.innerHTML='<canvas width="180" height="320"></canvas><span>'+['रॉयल क्लासिक','आधुनिक प्रोफेशनल','राजस्थानी परंपरा','विकास थीम','युवा और भविष्य'][i]+'</span>';b.addEventListener('click',()=>{t=i;document.querySelectorAll('.templ').forEach(q=>q.classList.toggle('active',Number(q.dataset.t)===t));draw();updateThumbs()});gallery.appendChild(b);thumbs.push(b)});
}
function drawThumbs(){thumbs.forEach((b,i)=>{const c=b.querySelector('canvas'),ctx=c.getContext('2d'),p=themes[i];ctx.clearRect(0,0,c.width,c.height);ctx.fillStyle=p.bg;ctx.fillRect(0,0,c.width,c.height);ctx.strokeStyle=p.gold;ctx.lineWidth=3;ctx.strokeRect(4,4,c.width-8,c.height-8);ctx.fillStyle=p.deep;ctx.fillRect(8,8,c.width-16,76);ctx.fillStyle=p.gold;ctx.textAlign='center';ctx.font='bold 12px sans-serif';ctx.fillText('ग्राम पंचायत लूणी',90,28);ctx.fillText('शिवाराम पटेल',90,51);ctx.fillStyle=p.cream;ctx.fillRect(22,92,136,150);if(candidate){const sc=Math.min(136/candidate.width,150/candidate.height),dw=candidate.width*sc,dh=candidate.height*sc;ctx.drawImage(candidate,(180-dw)/2,92+(150-dh)/2,dw,dh)}ctx.fillStyle=p.deep;ctx.fillRect(10,250,160,58);ctx.fillStyle=p.gold;ctx.font='bold 10px sans-serif';ctx.fillText(['आपका विश्वास','बेहतर कल','म्हारी लूणी','विकास','नई सोच'][i],90,270);ctx.fillText('निवेदक',90,290)});document.querySelectorAll('.templ').forEach(q=>q.classList.toggle('active',Number(q.dataset.t)===t))}
function loadImg(src,cb){const im=new Image();im.onload=()=>cb(im);im.onerror=()=>cb(null);im.src=src}
loadImg('candidate-photo.jpg',im=>{candidate=im;draw();updateThumbs()});
nm.addEventListener('input',draw);
file.addEventListener('change',()=>{const f=file.files&&file.files[0];if(!f){applicant=null;draw();return}if(!f.type.startsWith('image/')){alert('कृपया फोटो फ़ाइल चुनें');return}const r=new FileReader();r.onload=e=>loadImg(e.target.result,im=>{applicant=im;draw()});r.readAsDataURL(f)});
document.querySelectorAll('.templ').forEach(b=>b.addEventListener('click',()=>{t=Number(b.dataset.t);draw();updateThumbs()}));
document.getElementById('dl').addEventListener('click',()=>cv.toBlob(blob=>{if(!blob){alert('पोस्टर डाउनलोड नहीं हो पाया।');return}const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='shivaram-patel-luni-poster.png';a.click();setTimeout(()=>URL.revokeObjectURL(u),1500)},'image/png'));
document.getElementById('share').addEventListener('click',async()=>{try{const blob=await new Promise(resolve=>cv.toBlob(resolve,'image/png'));if(!blob)throw Error();const f=new File([blob],'shivaram-patel-luni-poster.png',{type:'image/png'});if(navigator.share&&navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'शिवाराम पटेल लूणी — पोस्टर',text:'अपना पोस्टर यहाँ बनाएँ: '+PORTAL})}else{document.getElementById('dl').click();alert('पोस्टर डाउनलोड हो गया। अब WhatsApp Status, Instagram या Facebook में इसे अपलोड करें।')}}catch(e){if(e.name!=='AbortError')alert('पोस्टर डाउनलोड करके अपने ऐप में शेयर करें।')}});
document.getElementById('wa').addEventListener('click',()=>window.open('https://wa.me/?text='+encodeURIComponent('शिवाराम पटेल लूणी का पोस्टर देखें। अपना पोस्टर यहाँ बनाएँ: '+PORTAL),'_blank','noopener'));
document.getElementById('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(PORTAL);alert('पोर्टल लिंक कॉपी हो गई!')}catch(e){prompt('इस लिंक को कॉपी करें:',PORTAL)}});
document.getElementById('reset').addEventListener('click',()=>{nm.value='';file.value='';applicant=null;t=0;draw();updateThumbs()});
updateThumbs();draw();
})();
</script>
</body>
</html>
